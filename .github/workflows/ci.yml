name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-api:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --name smoke -p 8000:8000 task-api:ci
          for i in $(seq 1 15); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image
        if: github.event_name == 'push'
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/fastapi-cicd
          docker tag task-api:ci $IMAGE:latest
          docker tag task-api:ci $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
